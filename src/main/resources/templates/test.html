<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/style.css}">

<title>thymeleaf 문법 연습</title>
</head>
<body>
	<div th:replace="~{fragments/header::header}"></div>



	<h2>타임리프 연습</h2>
	<hr>
	<h2>단순 변수값 출력</h2>
	<h3>이름 :<span th:text="${name}"></span></h3>
	<h3>나이 :<span th:text="${age}"></span></h3>
	<h2 th:text="${name}"></h2>
	<hr>
	<p th:if="${age<20}">성인입니다</p>
	<p th:if="${age<20}">성인입니다</p>
	<p th:if="${loginId}"></p>
	<p th:if="${age>20}">성인</p>
	<p th:unless="${age>=20}">미성년</p>
	<hr>
	<h2>반복문</h2>
	<table border = "1">
		<tr>
			<th>번호</th>
			<th>이름</th>
		</tr>
	
	<tr th:each="name,status:${strs}">
			<td th:text="${status.count}">번호</td>
			<td><a th:href="@{/question/list}" th:text="${name}">이름</a></td>
		</tr>
	</table>
	<hr>
	<h2>이미지불러오기</h2>
	<img th:src="@{/img/rose.jpg}">
	
	<div th:replace="~{fragments/footer::footer}"></div>
</body>
</html>
