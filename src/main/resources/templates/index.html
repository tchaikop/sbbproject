<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBB 커뮤니티 메인</title>
    <link rel="stylesheet" th:href="@{/index.css}">
</head>
<body>

    <div th:replace="~{header::header}"></div>

    <main class="main-wrapper">
        <section class="hero-card">
            <span class="badge">SPRING BOOT & THYMELEAF</span>
            <h1 class="hero-title">생각을 나누고 지식을 쌓는<br><span class="highlight">모던 Q&A 커뮤니티</span></h1>
            <p class="hero-desc">궁금한 점을 질문하고 개발자들과 함께 해결책을 찾아보세요.</p>
            <div class="hero-actions">
                <a th:href="@{/question/list}" class="btn-primary">질문 게시판 바로가기</a>
                <a th:href="@{/test}" class="btn-secondary">문법 연습 페이지</a>
            </div>
        </section>

        <section class="feature-grid">
            <div class="feature-card">
                <div class="icon-box">01</div>
                <h3>빠른 질문 등록</h3>
                <p>직관적인 에디터로 코드와 질문을 깔끔하게 공유할 수 있습니다.</p>
            </div>
            <div class="feature-card">
                <div class="icon-box">02</div>
                <h3>실시간 답변 소통</h3>
                <p>질문에 대한 다양한 해결책과 피드백을 한눈에 확인하세요.</p>
            </div>
            <div class="feature-card">
                <div class="icon-box">03</div>
                <h3>체계적인 아카이브</h3>
                <p>축적된 질문과 답변 데이터로 나만의 개발 노트를 완성합니다.</p>
            </div>
        </section>
    </main>

    <div th:replace="~{footer::footer}"></div>

</body>
</html>
